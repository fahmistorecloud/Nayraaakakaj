<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Downloader</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #000 0%, #1a1a2e 50%, #16213e 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #fff;
  }

  .container {
    width: 100%;
    max-width: 520px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    padding: 32px 24px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }

  .logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 8px;
  }

  .logo svg { width: 40px; height: 40px; }

  .logo h1 {
    font-size: 26px;
    font-weight: 700;
    background: linear-gradient(90deg, #25f4ee, #fe2c55);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    text-align: center;
    color: #888;
    font-size: 14px;
    margin-bottom: 28px;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
  }

  input[type="text"] {
    width: 100%;
    padding: 16px 18px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.06);
    color: #fff;
    font-size: 15px;
    outline: none;
    transition: all 0.3s;
  }

  input[type="text"]::placeholder { color: #666; }

  input[type="text"]:focus {
    border-color: #fe2c55;
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 0 0 3px rgba(254, 44, 85, 0.15);
  }

  button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(90deg, #25f4ee, #fe2c55);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s, opacity 0.2s;
  }

  button:hover:not(:disabled) { transform: translateY(-2px); }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  .loader {
    display: none;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255, 255, 255, 0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error {
    display: none;
    padding: 14px;
    border-radius: 12px;
    background: rgba(254, 44, 85, 0.15);
    border: 1px solid rgba(254, 44, 85, 0.4);
    color: #ff6b81;
    font-size: 14px;
    text-align: center;
    margin-bottom: 16px;
  }

  .result { display: none; margin-top: 24px; }

  .card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 18px;
    overflow: hidden;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .thumb {
    width: 100%;
    height: 220px;
    background: #000;
    object-fit: cover;
    display: block;
  }

  .info { padding: 18px; }

  .author {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(90deg, #25f4ee, #fe2c55);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
  }

  .author-info h3 { font-size: 15px; font-weight: 600; }
  .author-info span { font-size: 12px; color: #888; }

  .title {
    font-size: 14px;
    color: #ccc;
    line-height: 1.5;
    margin-bottom: 14px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .stats {
    display: flex;
    gap: 20px;
    margin-bottom: 18px;
    font-size: 13px;
    color: #888;
  }

  .stats span { display: flex; align-items: center; gap: 5px; }

  .downloads {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .btn-dl {
    padding: 13px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s;
  }

  .btn-dl:hover { background: rgba(255, 255, 255, 0.15); border-color: #fe2c55; }
  .btn-dl.primary { background: linear-gradient(90deg, #25f4ee, #fe2c55); border: none; grid-column: 1 / -1; }
  .btn-dl.primary:hover { opacity: 0.9; }
</style>
</head>
<body>

<div class="container">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-5.2 1.74 2.89 2.89 0 012.31-4.64 2.93 2.93 0 01.88.13V9.4a6.84 6.84 0 00-1-.05A6.33 6.33 0 005 20.1a6.34 6.34 0 0010.86-4.43v-7a8.16 8.16 0 004.77 1.52v-3.4a4.85 4.85 0 01-1-.1z" fill="#fe2c55"/>
    </svg>
    <h1>TikTok Downloader</h1>
  </div>
  <p class="subtitle">Download video TikTok tanpa watermark</p>

  <div class="error" id="error"></div>

  <div class="input-group">
    <input type="text" id="urlInput" placeholder="Tempel link TikTok di sini..." autocomplete="off">
    <button id="btnDownload" onclick="handleDownload()">
      <span id="btnText">Download</span>
      <div class="loader" id="loader"></div>
    </button>
  </div>

  <div class="result" id="result">
    <div class="card">
      <img class="thumb" id="thumb" alt="Thumbnail" crossorigin="anonymous">
      <div class="info">
        <div class="author">
          <div class="avatar" id="avatar">?</div>
          <div class="author-info">
            <h3 id="nickname">-</h3>
            <span id="username">-</span>
          </div>
        </div>
        <p class="title" id="title">-</p>
        <div class="stats">
          <span>▶ <b id="plays">0</b></span>
          <span>❤ <b id="likes">0</b></span>
          <span>⏱ <b id="duration">0</b>s</span>
        </div>
        <div class="downloads" id="downloads"></div>
      </div>
    </div>
  </div>
</div>

<script>
const API_BASE = 'https://api.iroha-api.web.id/v1/tt';

function formatNum(n) {
  n = Number(n) || 0;
  if (n >= 1e9) return (n/1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return n.toString();
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
}

function hideError() {
  document.getElementById('error').style.display = 'none';
}

function setLoading(loading) {
  const btn = document.getElementById('btnDownload');
  const text = document.getElementById('btnText');
  const loader = document.getElementById('loader');
  btn.disabled = loading;
  if (loading) {
    text.style.display = 'none';
    loader.style.display = 'block';
  } else {
    text.style.display = 'inline';
    loader.style.display = 'none';
  }
}

async function handleDownload() {
  const url = document.getElementById('urlInput').value.trim();
  hideError();

  if (!url) {
    showError('Masukkan link TikTok terlebih dahulu!');
    return;
  }

  if (!/tiktok\.com|vm\.tiktok\.com/.test(url)) {
    showError('Link tidak valid. Masukkan link TikTok yang benar.');
    return;
  }

  setLoading(true);
  document.getElementById('result').style.display = 'none';

  try {
    const res = await fetch(`${API_BASE}?url=${encodeURIComponent(url)}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();

    if (!json.status || !json.data) {
      throw new Error(json.message || 'Gagal mengambil data video');
    }

    renderResult(json.data);
  } catch (err) {
    showError('Error: ' + (err.message || 'Gagal mengambil data. Coba lagi.'));
  } finally {
    setLoading(false);
  }
}

function renderResult(data) {
  const author = data.author || {};
  const nickname = author.nickname || 'Unknown';
  const username = author.username || '@unknown';

  document.getElementById('nickname').textContent = nickname;
  document.getElementById('username').textContent = username;
  document.getElementById('avatar').textContent = nickname.charAt(0).toUpperCase();
  document.getElementById('title').textContent = data.title || 'Tanpa judul';
  document.getElementById('plays').textContent = formatNum(data.playCount);
  document.getElementById('likes').textContent = formatNum(data.diggCount);
  document.getElementById('duration').textContent = data.duration || 0;

  // Thumbnail (pakai videoUrl sebagai fallback preview)
  const thumb = document.getElementById('thumb');
  thumb.onerror = () => {
    thumb.style.display = 'none';
  };
  if (data.cover) {
    thumb.src = data.cover;
    thumb.style.display = 'block';
  } else {
    thumb.style.display = 'none';
  }

  // Tombol download
  const dl = document.getElementById('downloads');
  dl.innerHTML = '';

  if (data.videoUrlHd) {
    dl.innerHTML += `<a class="btn-dl primary" href="${data.videoUrlHd}" target="_blank" rel="noopener">⬇ Download HD (No Watermark)</a>`;
  }
  if (data.videoUrl) {
    dl.innerHTML += `<a class="btn-dl primary" href="${data.videoUrl}" target="_blank" rel="noopener">⬇ Download Video (No Watermark)</a>`;
  }
  if (data.videoUrlWatermark) {
    dl.innerHTML += `<a class="btn-dl" href="${data.videoUrlWatermark}" target="_blank" rel="noopener">🎬 Watermark</a>`;
  }
  if (data.music) {
    dl.innerHTML += `<a class="btn-dl" href="${data.music}" target="_blank" rel="noopener">🎵 Music</a>`;
  }

  document.getElementById('result').style.display = 'block';
}

// Enter key support
document.getElementById('urlInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') handleDownload();
});
</script>

</body>
</html>
